server:
  port: ${PORT:8080}

resolveai:
  auto-refund-limit: 200
  risk-threshold: 0.5
  min-confidence: 0.6
  max-steps: 14
  max-repeats: 2
  tool-failure-rate: ${TOOL_FAILURE_RATE:0.0}   # chaos testing, e.g. 0.15
  llm-planner: false                           # true = LLM picks tool calls (needs LLM_PROVIDER)
  # Used only for cost estimates. Set these to the published price of the model you run.
  input-price-per-m-tok: 3.0
  output-price-per-m-tok: 15.0

spring:
  application:
    name: resolve-ai
  ai:
    model:
      chat: ${LLM_PROVIDER:none}     # "anthropic" to use Claude; "none" = offline
      embedding: none
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 600
          temperature: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
